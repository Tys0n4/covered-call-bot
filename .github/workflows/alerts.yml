# Buy-back alerts, run by hand: wakes the API and asks it to check every account's
# open calls. The API posts to each account's Discord channel (set up on the
# Strategy page). The regular checks come from cron-job.org calling
# POST /alerts/cron every 30 minutes (see docs/how-it-works.md): GitHub's free
# schedule ran this only once in a whole trading day.
#
# Needs: repository secret ALERTS_KEY (same as on Railway).
# Optional: repository variable API_URL, if the backend isn't at the default URL.
name: Buy-back alerts

on:
  workflow_dispatch:          # "Run workflow" button on the Actions tab

concurrency:
  group: buyback-alerts
  cancel-in-progress: false

jobs:
  check:
    name: Check open calls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.API_URL || 'https://covered-call-bot-production.up.railway.app' }}
      ALERTS_KEY: ${{ secrets.ALERTS_KEY }}
    steps:
      - name: Check and alert
        run: |
          set -euo pipefail
          # The backend sleeps when idle; the first request wakes it, so retry for up to ~a minute.
          # It answers right away and checks in the background; Railway's logs show the result.
          curl -fsS --retry 6 --retry-all-errors --retry-delay 10 --max-time 60 \
            -X POST -H "X-Alerts-Key: $ALERTS_KEY" "$API_URL/alerts/cron" | tee result.json
          echo
          echo "Check started for every account with alerts on. See Railway's logs for what was sent." >> "$GITHUB_STEP_SUMMARY"
